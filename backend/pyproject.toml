[project]
name = "ask-the-archive"
version = "0.1.0"
description = "Ask the Archive — AI-powered enterprise document intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.1.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "argon2-cffi>=23.1.0",
    "PyJWT>=2.9.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "fpdf2>=2.7.0",
    "pdfplumber>=0.11.0",
    "pypdf>=4.3.0",
    "python-multipart>=0.0.12",
    "sentence-transformers>=3.0.0",
    "python-docx>=1.1.0",
    "pytesseract>=0.3.10",
    "striprtf>=0.0.26",
    "html2text>=2024.2.26",
    "openpyxl>=3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "alembic>=1.13.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
# The database engine is created at import time and holds a connection pool
# bound to the event loop that opened it. A session-scoped loop keeps that
# pool valid for the whole run; a per-test loop would close the loop under
# the pool and fail every test after the first.
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"